name: ImGui-MD3-OSS CI  
on:  
push:  
branches: [ main, master ]  
pull_request:  
workflow_dispatch:env:
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  ANDROID_NDK_ROOT: ${{ github.workspace }}/android-sdk/ndk/27.1.12297006
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    build:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 60
    strategy:
      matrix:
        flavor: [ full, proctest, range ]
 all ]
        build_type: [ debug, release ]
        exclude:
          - flavor: full
          build_type: release
          if: github.event_name == 'pull_request'

   :
  - name: Checkout code
    uses: actions/checkout@v4
    
    - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

    - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      cache-read-only: false

    - name: Setup Android SDK
    uses: android-actions/setup-android@v3
    with:
      sdk-tools-version: '9123335'
      cmdline-tools-version: '9.0'
      platform-tools-version: '33.0.5'
      build-tools-version: '33.0.2'
      platforms: 'android-33'
      emulator: false

    - name: Install NDK and CMake
    run: |
      yes | sdkmanager --install "ndk;27.1.12297006" "cmake;3.22.1"

    - name: Make gradlew executable
    run: chmod +x ./gradlew

    - name: Check project structure
    run: |
      echo "=== Project structure ==="
      ls -la
      echo "=== Gradle files ==="
      ls -la gradle*
      echo "=== App directory ==="
      ls -la app/
      echo "=== App build.gradle ==="
      head -20 app/build.gradle.kts

    - name: Run connected checks
    run: |
      if [ ${{ matrix.emulator }} = "true" ]; then
        echo "Running connected checks..."
        ./gradlew connectedCheck --continue
      else
        echo "Skipping emulator tests - no emulator available"
        ./gradlew test --continue
      fi

  build-all:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_inputs.flavor == 'all' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    timeout-minutes: 120

    steps:
      - name: Checkout code
      uses: actions/checkout@v4
      
      - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

      - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: false

      - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        sdk-tools-version: '9123335'
        cmdline-tools-version: '9.0'
        platform-tools-version: '34.0.5'
        build-tools-version: '33.0.2'
        platforms: 'android-33'
        emulator: false

      - name: Install NDK and CMake
      run: |
        yes | sdkmanager --install "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Make gradlew executable
      run: chmod +x ./gradlew

      - name: Build all debug APKs
      run: ./gradlew assembleDebug --stacktrace --no-daemon --info

      - name: Upload all debug APKs
      uses: actions/upload-artifact@v4
      with:
        name: all-debug-apks
        path: app/build/outputs/apk/*/debug/*.apk
        retention-days: 30

  deploy:
    runs-on: ubuntu-latest
    needs: [build, build-all]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
      - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts/

      - name: Create release notes
      run: |
        echo "## Build Summary" > release_notes.md
        echo "" >> release_notes.md
        echo "Build triggered by: ${{ github.actor }}" >> release_notes.md
        echo "Commit: ${{ github.sha }}" >> release_notes.md
        echo "Branch: ${{ github.ref_name }}" >> release_notes.md
        echo "" >> release_notes.md
        echo "### APK Files:" >> release_notes.md
        echo "" >> release_notes.md
        find artifacts/ -name "*.apk" -exec echo "- {}" \; >> release_notes.md

      - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: Build ${{ github.run_number }}
        body_path: release_notes.md
        files: artifacts/**/*.apk
        draft: false
        prerelease: false
        generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}