name: ImGui-MD3-OSS CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

env:
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  ANDROID_NDK_ROOT: ${{ github.workspace }}/android-sdk/ndk/27.1.12297006

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: full
            build_type: debug
            task: assembleFullDebug
          - flavor: full
            build_type: release
            task: assembleFullRelease
          - flavor: proctest
            build_type: debug
            task: assembleProctestDebug
          - flavor: proctest
            build_type: release
            task: assembleProctestRelease
          - flavor: range
            build_type: debug
            task: assembleRangeDebug
          - flavor: range
            build_type: release
            task: assembleRangeRelease

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          sdk-tools-version: '9123335'
          cmdline-tools-version: '9.0'
          platform-tools-version: '33.0.5'
          build-tools-version: '33.0.2'
          platforms: 'android-33'

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --install "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew ${{ matrix.task }} --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.flavor }}-${{ matrix.build_type }}
          path: app/build/outputs/apk/${{ matrix.flavor }}/${{ matrix.build_type }}/*.apk
          retention-days: 30

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}