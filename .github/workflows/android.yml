name: ImGui-MD3-OSS CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: full
            build_type: debug
            task: assembleFullDebug
          - flavor: full
            build_type: release
            task: assembleFullRelease
          - flavor: proctest
            build_type: debug
            task: assembleProctestDebug
          - flavor: proctest
            build_type: release
            task: assembleProctestRelease
          - flavor: range
            build_type: debug
            task: assembleRangeDebug
          - flavor: range
            build_type: release
            task: assembleRangeRelease

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # 删除了 android-actions/setup-android@v3，改为手动安装
      - name: Install Android SDK, NDK and CMake
        run: |
          # 找到系统自带的 sdkmanager 路径
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager | head -n 1)
          echo "Using sdkmanager: $SDKMANAGER"
          
          # 接受所有许可
          yes | $SDKMANAGER --licenses
          
          # 安装你项目需要的组件（platforms, build-tools, NDK, CMake）
          yes | $SDKMANAGER --install "platforms;android-33" "build-tools;33.0.2" "platform-tools" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew ${{ matrix.task }} --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.flavor }}-${{ matrix.build_type }}
          path: app/build/outputs/apk/${{ matrix.flavor }}/${{ matrix.build_type }}/*.apk
          retention-days: 30

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}